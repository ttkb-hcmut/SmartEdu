services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: always
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      ## sqlite in volume, swap to postgres via PREFECT_API_DATABASE_CONNECTION_URL when multi-machine load demands
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - capstone-net

networks:
  capstone-net:
    external: true
